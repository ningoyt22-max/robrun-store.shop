<script type="module">

import {
auth,
db,
createUserWithEmailAndPassword,
doc,
setDoc
}
from "./firebase.js";

document
.getElementById("registerBtn")
.addEventListener("click", async () => {

try {

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const user =
userCredential.user;

await setDoc(
doc(db,"users",user.uid),
{
email:user.email,
balance:0,
orders:0,
createdAt:Date.now()
}
);

alert("Firestore OK");

}
catch(error){

console.error(error);

alert(
error.code +
"\n\n" +
error.message
);

}

});

</script>
