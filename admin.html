<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>

body{
background:#0b0f16;
color:white;
font-family:Arial,sans-serif;
padding:30px;
}

.card{
background:#161b22;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

input{
padding:10px;
width:250px;
margin-right:10px;
}

button{
padding:10px 15px;
cursor:pointer;
background:#ff9800;
border:none;
color:white;
border-radius:8px;
}

</style>
</head>
<body>

<h1>🛠 ADMIN PANEL</h1>

<div class="card">

<h3>Изменить баланс</h3>

<input
id="uid"
placeholder="UID пользователя">

<input
id="balance"
type="number"
placeholder="Баланс">

<button id="saveBtn">
Сохранить
</button>

</div>

<script type="module">

import {
db,
doc,
updateDoc
}
from "./firebase.js";

document
.getElementById("saveBtn")
.addEventListener("click",async()=>{

const uid =
document.getElementById("uid").value;

const balance =
parseInt(
document.getElementById("balance").value
);

try{

await updateDoc(
doc(db,"users",uid),
{
balance:balance
}
);

alert("✅ Баланс изменен");

}
catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
