<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL</title>

<style>
body{
background:#0b0f16;
color:white;
font-family:Arial;
padding:20px;
}

.order{
background:#161b22;
padding:20px;
margin-bottom:15px;
border-radius:15px;
}
</style>

</head>

<body>

<h1>🛠 Заказы ROBRUN</h1>

<div id="orders"></div>

<script type="module">

import {
db,
collection,
getDocs
}
from "./firebase.js";

const ordersDiv =
document.getElementById("orders");

const snapshot =
await getDocs(
collection(db,"orders")
);

snapshot.forEach(doc=>{

const order =
doc.data();

ordersDiv.innerHTML += `

<div class="order">

<p><b>Email:</b> ${order.email}</p>

<p><b>Валюта:</b> ${order.amount}</p>

<p><b>Цена:</b> ${order.price} ₽</p>

<p><b>Статус:</b> ${order.status}</p>

</div>

`;

});

</script>

</body>
</html>
