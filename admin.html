<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBRUN ADMIN</title>

<style>

body{
background:#0b0f16;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
color:#ff9800;
}

.order{

background:#161b22;
padding:20px;
margin-bottom:15px;
border-radius:15px;

}

button{

background:#ff9800;
border:none;
padding:10px 15px;
cursor:pointer;
color:white;
border-radius:10px;

}

</style>

</head>

<body>

<h1>📦 Заказы ROBRUN</h1>

<div id="orders"></div>

<script type="module">

import {
db,
collection,
getDocs
}
from "./firebase.js";

const ordersContainer =
document.getElementById("orders");

const snapshot =
await getDocs(
collection(db,"orders")
);

snapshot.forEach(orderDoc=>{

const order =
orderDoc.data();

ordersContainer.innerHTML += `

<div class="order">

<p><b>Email:</b> ${order.email}</p>

<p><b>Валюта:</b> ${order.amount}</p>

<p><b>Цена:</b> ${order.price} ₽</p>

<p><b>Статус:</b> ${order.status}</p>

<p><b>Исполнитель:</b> ${order.worker || 'Никто'}</p>

<button onclick="takeOrder('${orderDoc.id}')">
Взять заказ
</button>

</div>

`;

});

import {
  updateDoc,
  doc
}
from "./firebase.js";

window.takeOrder = async (id)=>{

await updateDoc(
doc(db,"orders",id),
{
status:"В работе",
worker:"ningoyt@gmail.com"
}
);

location.reload();

};

</script>

</body>
</html>
