<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL</title>

<style>
body{
background:#0b0f16;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.order{
background:#161b22;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

button{
background:#ff9800;
border:none;
padding:10px 15px;
color:white;
cursor:pointer;
border-radius:8px;
}
</style>

</head>
<body>

<h1>🛠 Заказы</h1>

<div id="orders"></div>

<script type="module">

import {
db,
collection,
getDocs
}
from "./firebase.js";

const ordersDiv =
document.getElementById("orders");

const snap =
await getDocs(
collection(db,"orders")
);

snap.forEach(doc=>{

const order =
doc.data();

ordersDiv.innerHTML += `
<div class="order">

<p><b>Email:</b> ${order.email}</p>

<p><b>Валюта:</b> ${order.amount}</p>

<p><b>Цена:</b> ${order.price} ₽</p>

<p><b>Статус:</b> ${order.status}</p>

</div>
`;

});

</script>

</body>
</html>
