<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBRUN STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#05070c;
color:#fff;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:60px 60px;
z-index:-2;
}

body::after{
content:"";
position:fixed;
width:800px;
height:800px;
left:-200px;
top:-200px;
background:radial-gradient(circle,#3d5afe30,transparent 70%);
z-index:-1;
}

.container{
width:90%;
max-width:1280px;
margin:auto;
}

header{
height:90px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:800;
}

.logo span{
color:#4e7dff;
}

nav{
display:flex;
gap:35px;
}

nav a{
color:#a7a7a7;
text-decoration:none;
transition:.3s;
}

nav a:hover{
color:#fff;
}

.telegram{
padding:14px 25px;
border-radius:40px;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.03);
color:#fff;
text-decoration:none;
}

.hero{
padding:100px 0;
display:grid;
grid-template-columns:1fr 500px;
gap:60px;
align-items:center;
}

.badge{
display:inline-block;
padding:12px 18px;
border-radius:50px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
margin-bottom:25px;
color:#59ff95;
}

.hero h1{
font-size:80px;
line-height:1;
margin-bottom:25px;
}

.hero p{
font-size:22px;
color:#959595;
margin-bottom:30px;
}

.buttons{
display:flex;
gap:15px;
}

.btn{
padding:17px 32px;
border-radius:40px;
text-decoration:none;
font-weight:700;
}

.btn-main{
background:white;
color:black;
}

.btn-second{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
color:white;
}

.stats{
display:flex;
gap:60px;
margin-top:70px;
}

.stat h2{
font-size:42px;
}

.stat p{
color:#707070;
}

.info-card{
background:rgba(255,255,255,.04);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
padding:30px;
}

.row{
display:flex;
justify-content
