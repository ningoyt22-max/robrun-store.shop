<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Личный кабинет | ROBRUN STORE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#0b0f16;
color:white;
min-height:100vh;
}

.header{
padding:20px 40px;
border-bottom:1px solid rgba(255,255,255,.08);
background:#111722;
}

.logo{
font-size:32px;
font-weight:800;
color:#ff9d00;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.welcome{
margin-bottom:30px;
}

.welcome h1{
font-size:42px;
margin-bottom:10px;
}

.welcome p{
color:#999;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:#161b22;
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
}

.card h3{
color:#ff9d00;
margin-bottom:15px;
}

.balance{
font-size:48px;
font-weight:800;
}

.btn{
display:inline-block;
padding:15px 25px;
border-radius:12px;
text-decoration:none;
border:none;
cursor:pointer;
color:white;
font-weight:bold;

background:
linear-gradient(
135deg,
#ff6b00,
#ffb300
);
}

.logout{
margin-top:30px;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
ROBRUN STORE
</div>

</div>

<div class="container">

<div class="welcome">

<h1>
Личный кабинет
</h1>

<p>
Добро пожаловать,
<span id="email"></span>
</p>

</div>

<div class="cards">

<div class="card">

<h3>Баланс</h3>

<div class="balance">
0 ₽
</div>

</div>

<div class="card">

<h3>Покупка валюты</h3>

<p>
Покупайте игровую валюту RobRun
по лучшим ценам.
</p>

<br>

<a href="shop.html" class="btn">
Перейти в магазин
</a>

</div>

<div class="card">

<h3>Заказы</h3>

<p>
У вас пока нет заказов.
</p>

</div>

</div>

<div class="logout">

<button
id="logout"
class="btn">

Выйти

</button>

</div>

</div>

<script type="module">

import {
auth,
signOut,
onAuthStateChanged
}
from "./firebase.js";

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="login.html";
return;

}

document.getElementById(
"email"
).textContent =
user.email;

});

document
.getElementById("logout")
.addEventListener("click",async()=>{

await signOut(auth);

location.href="login.html";

});

</script>

</body>
</html>
