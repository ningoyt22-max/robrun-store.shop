<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет | ROBRUN STORE</title>

<style>
body{
    margin:0;
    font-family:Inter,sans-serif;
    background:#0b0f16;
    color:white;
}

.header{
    padding:20px 40px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:28px;
    font-weight:800;
    color:#ff9d00;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#161b22;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:25px;
}

.card h2{
    margin-top:0;
    color:#ff9d00;
}

.balance{
    font-size:42px;
    font-weight:800;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-weight:700;

    background:
    linear-gradient(
        135deg,
        #ff6b00,
        #ffb300
    );
}
</style>

</head>
<body>

<div class="header">
<div class="logo">
ROBRUN STORE
</div>
</div>

<div class="container">

<h1>Личный кабинет</h1>

<p>
Пользователь:
<b id="email"></b>
</p>

<div class="grid">

<div class="card">
<h2>Баланс</h2>

<div class="balance">
0 ₽
</div>
</div>

<div class="card">
<h2>Заказы</h2>

<p>
Пока нет заказов
</p>
</div>

<div class="card">
<h2>Покупка</h2>

<button
onclick="location.href='shop.html'">
Купить валюту
</button>

</div>

</div>

<br>

<button id="logout">
Выйти
</button>

</div>

<script type="module">

import {
auth,
signOut,
onAuthStateChanged
}
from "./firebase.js";

onAuthStateChanged(auth,(user)=>{

    if(!user){

        location.href="login.html";
        return;

    }

    document
    .getElementById("email")
    .textContent =
    user.email;

});

document
.getElementById("logout")
.addEventListener("click",async()=>{

    await signOut(auth);

    location.href="login.html";

});

</script>

</body>
</html>
