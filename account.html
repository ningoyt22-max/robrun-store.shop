<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Личный кабинет | ROBRUN STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0b0f16;
color:white;
min-height:100vh;
}

body::before{
content:"";
position:fixed;
inset:0;

background-image:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

background-size:50px 50px;

z-index:-2;
}

.header{
height:80px;
display:flex;
justify-content:space-between;
align-items:center;

padding:0 40px;

background:#111722;

border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:30px;
font-weight:800;
color:#ff9d00;
}

.menu{
display:flex;
gap:25px;
}

.menu a{
color:white;
text-decoration:none;
transition:.3s;
}

.menu a:hover{
color:#ff9d00;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.welcome{
margin-bottom:40px;
}

.welcome h1{
font-size:48px;
margin-bottom:10px;
}

.welcome p{
color:#9ca3af;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:#161b22;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:25px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
color:#ff9d00;
margin-bottom:15px;
}

.balance{
font-size:48px;
font-weight:800;
}

.btn{
display:inline-block;

padding:14px 25px;

border:none;
border-radius:12px;

cursor:pointer;

font-weight:700;

color:white;

background:
linear-gradient(
135deg,
#ff6b00,
#ffb300
);

text-decoration:none;
}

.logout{
margin-top:30px;
}

.email{
color:#ffb300;
}

@media(max-width:768px){

.header{
flex-direction:column;
height:auto;
padding:15px;
gap:15px;
}

.menu{
flex-wrap:wrap;
justify-content:center;
}

.welcome h1{
font-size:34px;
}

.balance{
font-size:36px;
}

}

</style>

</head>

<body>

<header class="header">

<div class="logo">
ROBRUN STORE
</div>

<nav class="menu">
<a href="index.html">Главная</a>
<a href="shop.html">Магазин</a>
<a
