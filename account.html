<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет</title>

<style>
body{
    margin:0;
    background:#0b0f16;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#161b22;
    padding:20px;
}

.logo{
    color:#ff9d00;
    font-size:30px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.card{
    background:#161b22;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
}

.btn{
    background:#ff9d00;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">
ROBRUN STORE
</div>
</div>

<div class="container">

<h1>Личный кабинет</h1>

<div class="card">
Email:
<b id="email">Загрузка...</b>
</div>

<div class="card">
Баланс: 0 ₽
</div>

<button id="logout" class="btn">
Выйти
</button>

</div>

<script type="module">

import {
auth,
signOut,
onAuthStateChanged
} from "./firebase.js";

onAuthStateChanged(auth,(user)=>{

    if(!user){
        location.href="login.html";
        return;
    }

    document.getElementById("email").textContent =
    user.email;

});

document.getElementById("logout")
.addEventListener("click",async()=>{

    await signOut(auth);

    location.href="index.html";

});

</script>

</body>
</html>
