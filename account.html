<h1>Личный кабинет</h1>

<p id="userEmail"></p>

<button id="logout">
Выйти
</button>

<script type="module">

import {
auth,
signOut,
onAuthStateChanged
}
from "./firebase.js";

onAuthStateChanged(auth,user=>{

if(!user){

location.href="login.html";

return;

}

document
.getElementById("userEmail")
.innerText=user.email;

});

document
.getElementById("logout")
.addEventListener("click",()=>{

signOut(auth);

});

</script>
